[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafnyutils"
version = "0.1.0"
description = "Dafny benchmark problems, specifications and task definitions"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pyright", "pytest", "pytest-xdist", "ruff==0.15.12"]
contributor = ["click", "pytest", "pytest-xdist"]

[project.scripts]
dafnyutils-benchmarks = "benchmarks.__main__:main"
dafnyutils-contribute = "benchmark_tools.contribution.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-n0 -m 'not integration'"
testpaths = ["tests"]
norecursedirs = ["bench", "tools"]
markers = [
    "dafny_verify: runs Dafny verification for benchmark source",
    "integration: process, native-tool, or multi-component tests for final validation",
]

[tool.ruff]
required-version = "0.15.12"
target-version = "py312"
line-length = 100
exclude = [
    "_build",
    "coreutils",
    "dafny",
]

[tool.ruff.lint]
select = ["C90", "E", "F", "I", "PLC0415"]

[tool.ruff.lint.mccabe]
max-complexity = 10
