[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafnyutils"
version = "0.1.0"
description = "Dafny benchmarks and isolated evaluation APIs"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pyright", "pytest", "pytest-xdist", "ruff"]
contributor = ["click"]

[project.scripts]
dafnyutils-benchmarks = "benchmarks.__main__:main"

[tool.setuptools]
py-modules = ["dafny_cli", "entry_contract", "standard_library", "verification"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evaluation.submission" = ["*.sh"]
"evaluation.task" = ["scripts/*.sh"]

[tool.pytest.ini_options]
addopts = "-n 16"
testpaths = ["tests"]
norecursedirs = ["bench", "tools"]
markers = [
    "dafny_verify: runs Dafny verification for benchmark source",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "_build",
    "coreutils",
    "dafny",
]

[tool.ruff.lint]
select = ["C90", "E", "F", "I", "PLC0415"]

[tool.ruff.lint.mccabe]
max-complexity = 10
