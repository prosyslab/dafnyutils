name: benchmark-contribution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Z3
        run: |
          sudo apt-get update && sudo apt-get install -y z3
          z3 --version
      - run: python -m pip install -e '.[dev,contributor]'
      - run: make build-dafny
      - run: sudo ln -s "$GITHUB_WORKSPACE/dafny/Binaries/Dafny" /usr/bin/dafny-benchmark
      - run: PYTHONPATH=src python -m benchmarks validate
      - name: Validate generated public task contracts
        run: PYTHONPATH=src python -m tools.generate_task_profiles
      - name: Review public task contract changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No baseline commit exists; all current task contracts are new."
          else
            PYTHONPATH=src python -m tools.compare_task_profiles --base-ref "$BASE_SHA"
          fi
      - run: PYTHONPATH=src python -m pytest -q tests
      - run: ruff check src tests tools/bench tools/audit tools/generate_task_profiles.py tools/compare_task_profiles.py tools/coreutils_fuzzer/run.py
      - run: pyright

  affected-items:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Z3 and GNU build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y z3 autoconf automake autopoint bison gperf texinfo
          z3 --version
      - run: python -m pip install -e '.[dev,contributor]'
      - run: make build-dafny
      - run: sudo ln -s "$GITHUB_WORKSPACE/dafny/Binaries/Dafny" /usr/bin/dafny-benchmark
      - run: make build-coreutils
      - name: Run mandatory checks for affected items
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if ! changed_output=$(git diff --no-renames --name-only "$BASE_SHA" HEAD); then
              echo "failed to determine changed paths from the base commit" >&2
              exit 1
            fi
          else
            if ! changed_output=$(git ls-tree -r --name-only HEAD); then
              echo "failed to enumerate tracked paths for conservative validation" >&2
              exit 1
            fi
          fi
          if [[ -z "$changed_output" ]]; then
            exit 0
          fi
          mapfile -t changed <<< "$changed_output"
          args=()
          for path in "${changed[@]}"; do
            args+=(--changed-path "$path")
          done
          PYTHONPATH=src python -m benchmarks check "${args[@]}"
